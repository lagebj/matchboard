version: 2

updates:
  # Application dependencies from package.json/package-lock.json
  - package-ecosystem: "npm"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"

    open-pull-requests-limit: 6

    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

    ignore:
    # TypeScript 7 uses the new native compiler and is not yet supported by
    # Next.js' compiler integration or the current typescript-eslint toolchain.
    # Remove this restriction once both officially support TypeScript 7.
      - dependency-name: "typescript"
        versions:
          - ">=7" 

    groups:
      # Keep the tightly coupled Next.js and React packages aligned.
      next-react:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "babel-plugin-react-compiler"
        update-types:
          - "minor"
          - "patch"

      # Prisma packages should normally move together.
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
        update-types:
          - "minor"
          - "patch"

      # Auth.js packages are coupled, particularly while next-auth is beta.
      authentication:
        patterns:
          - "next-auth"
          - "@auth/*"
        update-types:
          - "minor"
          - "patch"

      # Consolidate remaining routine production updates.
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

      # Consolidate linting, testing and build-tool updates.
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Images referenced by docker-compose.yml
  - package-ecosystem: "docker-compose"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Oslo"

    open-pull-requests-limit: 2

    commit-message:
      prefix: "chore(deps)"

    ignore:
      # Local Docker Compose Postgres must stay on the same major version Neon actually runs in
      # production/test (verified via the Neon API: pg_version 17 everywhere as of 2026-08-28).
      # A local-only major bump would silently diverge dev from production and risk
      # migration/behaviour differences never caught until deploy. Bump this deliberately,
      # together with a real Neon major-version upgrade -- see PR #346 (closed, not merged).
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

    groups:
      container-images:
        patterns:
          - "*"

  # Actions referenced from .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Oslo"

    open-pull-requests-limit: 3

    commit-message:
      prefix: "chore(deps)"

    groups:
      github-actions:
        patterns:
          - "*"
