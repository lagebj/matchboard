name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint

  security-check-sql:
    name: Forbidden SQL Methods
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run security:check-sql

  security-check-supply-chain:
    name: Supply Chain Integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run security:check-supply-chain

  test:
    name: Tests
    runs-on: ubuntu-24.04
    # CI test environment only — production uses Vercel/Neon secrets
    env:
      TEST_DATABASE_URL: "postgresql://matchboard:matchboard@localhost:5432/matchboard_test?schema=public"
      DATABASE_URL: "postgresql://matchboard:matchboard@localhost:5432/matchboard_test?schema=public"
      AUTH_SECRET: "ci-test-secret-not-for-production"
      ALLOWED_COACH_EMAILS: "test@example.com"
      BYPASS_AUTH: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matchboard
          POSTGRES_PASSWORD: matchboard
          POSTGRES_DB: matchboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DIRECT_URL: "postgresql://matchboard:matchboard@localhost:5432/matchboard_test?schema=public"
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [typecheck, test, security-check-supply-chain]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build