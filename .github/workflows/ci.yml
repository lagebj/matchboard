name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint

  security-check-sql:
    name: Forbidden SQL Methods
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run security:check-sql

  security-check-supply-chain:
    name: Supply Chain Integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run security:check-supply-chain

  version-verify:
    name: Version Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run version:verify

  test:
    name: Tests
    runs-on: ubuntu-24.04
    # CI test environment only — production uses Vercel/Neon secrets
    env:
      TEST_DATABASE_URL: "postgresql://matchboard:matchboard@localhost:5432/matchboard_test?schema=public"
      TEST_DATABASE_DIRECT_URL: "postgresql://matchboard:matchboard@localhost:5432/matchboard_test?schema=public"
      DATABASE_URL: "postgresql://matchboard:matchboard@localhost:5432/matchboard_test?schema=public"
      AUTH_SECRET: "ci-test-secret-not-for-production"
      BYPASS_AUTH: "true"
      MATCHBOARD_ENV: "test"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matchboard
          POSTGRES_PASSWORD: matchboard
          POSTGRES_DB: matchboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DIRECT_URL: "postgresql://matchboard:matchboard@localhost:5432/matchboard_test?schema=public"
      - run: npm test

  migration-from-zero:
    name: Migration from Zero
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matchboard
          POSTGRES_PASSWORD: matchboard
          POSTGRES_DB: matchboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Apply all migrations from empty database
        run: |
          MIGRATE_DB="migrate_verify_$(date +%s)"
          PGPASSWORD=matchboard psql -h localhost -p 5432 -U matchboard -d postgres -c "CREATE DATABASE \"$MIGRATE_DB\";"
          DIRECT_URL="postgresql://matchboard:matchboard@localhost:5432/$MIGRATE_DB?schema=public" npx prisma migrate deploy
          PGPASSWORD=matchboard psql -h localhost -p 5432 -U matchboard -d postgres -c "DROP DATABASE IF EXISTS \"$MIGRATE_DB\";"

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [typecheck, test, security-check-supply-chain]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build