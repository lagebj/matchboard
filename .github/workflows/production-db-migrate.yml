name: Production DB Migration

run-name: >-
  Production DB migration (${{ github.event_name == 'workflow_run' && 'auto after CI' || 'manual' }})

# Consolidates the former separate "Production DB Audit" and "Production DB Migration" workflows
# into one automated pipeline (ADR-0084). Runs automatically the moment CI succeeds on main, so a
# red main never even reaches the approval gate. The actual migration step still requires a human
# approval via the production-db GitHub Environment's required-reviewer protection rule — that
# protection applies regardless of trigger type, so automating the trigger does not remove the
# human checkpoint. workflow_dispatch is kept as a manual fallback (e.g. re-running after
# approving too late for the original run, or triggering ad hoc without waiting for a CI event).
#
# The `check` job deliberately does NOT declare `environment: production-db` -- it must run
# unattended so the pending-migration/destructive-scan summary is visible to the approver BEFORE
# they approve, not after. That means it cannot see PRODUCTION_DATABASE_URL, which is scoped to
# that environment. It uses PRODUCTION_DATABASE_URL_STATUS_CHECK instead: a separate, repo-level
# (non-environment-scoped) secret for `matchboard_migration_status`, a minimal role granted only
# CONNECT + SELECT on `_prisma_migrations` -- nothing else, no neon_superuser membership. Confirmed
# by direct test: this role can run `prisma migrate status` successfully and gets "permission
# denied" reading any application table. See ADR-0084.
#
# ## Recovering a FAILED migration
#
# `prisma migrate status` reports a migration in one of three states: up to date, pending
# ("have not yet been applied"), or FAILED ("have failed" -- a previous `migrate deploy` attempt
# errored partway through). ADR-0084 anticipated the FAILED case as a `check`-job failure mode but
# did not originally build a recovery path for it (see ADR-0084 History, 2026-08-23 entry) --
# `check-pending-migrations.mjs` deliberately refuses to treat a FAILED migration as a normal
# pending one, so `has_pending` never becomes `true` and the normal `migrate` job never runs while
# a migration is stuck FAILED, by design.
#
# To recover: trigger this workflow manually (workflow_dispatch) with `resolve_migration` set to
# the exact migration folder name `check`/`migrate`'s logs report as failed, and `resolve_mode`
# left at its default (`rolled-back`) unless the database was already fixed by hand. This runs
# `prisma migrate resolve` -- bookkeeping only, it does not touch application data or schema --
# through the `resolve-failed-migration` job below, gated by the same `production-db` environment
# approval as every other production-touching job in this pipeline. Once resolved, trigger this
# workflow again with no inputs (or just push to main) to run the normal check+apply flow, which
# will now see the migration as cleanly pending. If the migration's own SQL had a bug (the actual
# cause of the 2026-08-23 incident), fix that in the migration file in the same PR that adds the
# resolve trigger -- resolving bookkeeping without fixing the SQL just fails again identically.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      resolve_migration:
        description: >-
          Recovery-only: name of a migration Prisma reports as FAILED (not a normal pending
          migration) that needs `prisma migrate resolve` before the normal check+apply flow can
          run again. Leave empty for the normal check+apply flow. See "Recovering a FAILED
          migration" below.
        required: false
        type: string
      resolve_mode:
        description: >-
          Only used when resolve_migration is set. Use rolled-back when the migration's DDL did
          not durably apply (the normal case — Postgres runs each migration.sql in one
          transaction, so an error partway through rolls back everything in that file). Use
          applied only if someone already fixed the database by hand to match what the migration
          intended.
        required: false
        type: choice
        options:
          - rolled-back
          - applied
        default: rolled-back

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  resolve-failed-migration:
    name: Resolve FAILED migration (requires approval)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.resolve_migration != ''
    runs-on: ubuntu-24.04

    environment:
      name: production-db

    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration status before resolve
        run: npx prisma migrate status || true

      - name: Resolve
        run: |
          npx prisma migrate resolve \
            --${{ github.event.inputs.resolve_mode }} \
            "${{ github.event.inputs.resolve_migration }}"

      - name: Migration status after resolve
        run: npx prisma migrate status || true

  check:
    name: Check for pending migrations
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.resolve_migration == '') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    outputs:
      has_pending: ${{ steps.check.outputs.has_pending }}
      has_destructive: ${{ steps.check.outputs.has_destructive }}
      ref: ${{ steps.resolve-ref.outputs.ref }}
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL_STATUS_CHECK }}
      DIRECT_URL: ${{ secrets.PRODUCTION_DATABASE_URL_STATUS_CHECK }}
    steps:
      - name: Resolve ref to check
        id: resolve-ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ steps.resolve-ref.outputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Migration history
        run: npx prisma migrate status || true

      # Uses `prisma migrate status`'s exit code (0 = up to date, 1 = pending), not
      # `prisma migrate diff --exit-code` -- the latter reports pre-existing, unrelated schema
      # drift (index/RLS differences between the declarative schema and the actual migration
      # history) on every run, even against a fully, freshly migrated database. Confirmed
      # empirically before writing this pipeline; see ADR-0084.
      - name: Check for pending migrations and scan for destructive operations
        id: check
        run: node scripts/check-pending-migrations.mjs

  migrate:
    name: Apply migration (requires approval)
    needs: check
    if: needs.check.outputs.has_pending == 'true'
    runs-on: ubuntu-24.04

    environment:
      name: production-db

    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ needs.check.outputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply pending migrations
        run: npm run db:migrate

      # Same reasoning as the check job: `migrate status`'s exit code, not `migrate diff
      # --exit-code`, is the reliable "did this actually finish applying everything" signal.
      - name: Verify all migrations are applied
        run: npx prisma migrate status

      - name: Record resulting schema diff (informational, not a pass/fail gate)
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema=prisma/schema.prisma \
            || true
