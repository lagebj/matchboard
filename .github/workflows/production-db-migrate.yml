name: Production DB Migration

run-name: >-
  Production DB migration (${{ github.event_name == 'workflow_run' && 'auto after CI' || 'manual' }})

# Consolidates the former separate "Production DB Audit" and "Production DB Migration" workflows
# into one automated pipeline (ADR-0084). Runs automatically the moment CI succeeds on main, so a
# red main never even reaches the approval gate. The actual migration step still requires a human
# approval via the production-db GitHub Environment's required-reviewer protection rule — that
# protection applies regardless of trigger type, so automating the trigger does not remove the
# human checkpoint. workflow_dispatch is kept as a manual fallback (e.g. re-running after
# approving too late for the original run, or triggering ad hoc without waiting for a CI event).

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  check:
    name: Check for pending migrations
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    outputs:
      has_pending: ${{ steps.check.outputs.has_pending }}
      has_destructive: ${{ steps.check.outputs.has_destructive }}
      ref: ${{ steps.resolve-ref.outputs.ref }}
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Resolve ref to check
        id: resolve-ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ steps.resolve-ref.outputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Migration history
        run: npx prisma migrate status || true

      # Uses `prisma migrate status`'s exit code (0 = up to date, 1 = pending), not
      # `prisma migrate diff --exit-code` -- the latter reports pre-existing, unrelated schema
      # drift (index/RLS differences between the declarative schema and the actual migration
      # history) on every run, even against a fully, freshly migrated database. Confirmed
      # empirically before writing this pipeline; see ADR-0084.
      - name: Check for pending migrations and scan for destructive operations
        id: check
        run: node scripts/check-pending-migrations.mjs

  migrate:
    name: Apply migration (requires approval)
    needs: check
    if: needs.check.outputs.has_pending == 'true'
    runs-on: ubuntu-24.04

    environment:
      name: production-db

    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ needs.check.outputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply pending migrations
        run: npm run db:migrate

      # Same reasoning as the check job: `migrate status`'s exit code, not `migrate diff
      # --exit-code`, is the reliable "did this actually finish applying everything" signal.
      - name: Verify all migrations are applied
        run: npx prisma migrate status

      - name: Record resulting schema diff (informational, not a pass/fail gate)
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema=prisma/schema.prisma \
            || true
