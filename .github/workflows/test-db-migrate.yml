name: Test DB Migration

run-name: >-
  Test DB migration (${{ github.event_name == 'push' && 'auto after push to main' || 'manual' }})

# Keeps the persistent Neon "test" branch up to date with the migration history on main.
#
# This branch is not the same thing as any CI job's own database: `ci-checks.yml`'s "Tests" job
# spins up a fresh, disposable postgres:17 service container per run (always migrated from zero,
# never at risk of drift). The persistent "test" branch is a different, longer-lived resource:
# every per-PR Test-slot deploy (test-acceptance.yml, ADR-0075) forks an isolated Neon *child*
# branch from it and migrates only that child — never the parent itself. Before this workflow
# existed, nothing ever migrated the parent directly, so it silently fell behind every time a new
# migration merged to main. Confirmed live, 2026-08-23: this branch was 3 migrations behind and,
# separately, had a partially-seeded dataset (2 orphaned users, 0 memberships) left over from an
# old pre-fix seed run (see docs/adr/0075's History) — both were masquerading as "Test-slot
# flake" across four consecutive PRs before being root-caused and fixed by hand.
#
# Trigger is `push` to main, not `workflow_run` after CI. It was originally `workflow_run` gated
# on the triggering CI run's conclusion being 'success' -- but `ci-checks.yml`'s own "Browser
# Acceptance Tests" job runs against this exact persistent branch, so a migration that changes
# the schema created a self-perpetuating deadlock: CI fails (because Browser Acceptance Tests
# fails against the not-yet-migrated branch) -> this workflow never fires (it required CI to have
# succeeded) -> the branch never gets migrated -> CI keeps failing on every subsequent run too,
# not just the one that introduced the migration. Recurred exactly this way on 2026-08-28 (PR
# #365's matchDurationMinutes migration) and could only be broken by a manual workflow_dispatch.
# Triggering on `push` instead removes the dependency on any other job's outcome entirely: the
# migration applies the moment a commit lands on main, before Browser Acceptance Tests needs it,
# regardless of whether unrelated jobs (lint, typecheck, ...) in that same push's CI run pass or
# fail. This fires somewhat more eagerly than before (every push, not just ones where full CI
# passed), which is an accepted tradeoff given the no-approval-gate posture explained below.
#
# No approval gate, unlike production-db-migrate.yml: this targets disposable, canonical test
# data (scripts/seed-test-dataset.ts, invoked via the `restore-test-baseline` swamp procedure,
# fully re-seeds it from scratch on demand) — a bad migration here has none of the blast radius a
# bad production migration has, so a human-approval checkpoint on every routine run would be pure
# friction with no matching safety benefit. This workflow only ever runs `prisma migrate deploy`
# (schema, additive) — it never reseeds data; reseeding remains a deliberate, separate,
# human-invoked action (`restore-test-baseline`), not something that happens automatically on
# every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate persistent test branch
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
      TEST_DATABASE_DIRECT_URL: ${{ secrets.TEST_DATABASE_DIRECT_URL }}
    steps:
      - name: Resolve ref to migrate
        id: resolve-ref
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve-ref.outputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply pending migrations to the persistent test branch
        run: npm run db:migrate

      - name: Verify all migrations are applied
        run: npx prisma migrate status
