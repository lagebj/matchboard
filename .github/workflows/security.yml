name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Install Semgrep
        run: pip install semgrep==1.112.0
      - name: Run Semgrep
        run: |
          semgrep --config security/semgrep/matchboard-rules.yml \
                   --json \
                   --output .security/results/semgrep-results.json \
                   src/ || true
      - name: Check for findings
        run: python3 scripts/parse-semgrep-findings.py .security/results/semgrep-results.json

  dependency-scan:
    name: OSV Dependency Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Install OSV-Scanner
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
      - name: Run OSV-Scanner
        run: |
          osv-scanner scan --config=security/osv-scanner.toml . || true
        continue-on-error: true

  secret-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.22.1/gitleaks_8.22.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - name: Run Gitleaks
        run: |
          gitleaks detect --config security/gitleaks.toml --no-git --source . || true
      - name: Run Gitleaks on history
        run: |
          gitleaks detect --config security/gitleaks.toml --source . || true

  authz-tests:
    name: Authorization Security Tests
    runs-on: ubuntu-24.04
    env:
      TEST_DATABASE_URL: "postgresql://matchboard:matchboard@localhost:5432/matchboard_test?schema=public"
      TEST_DATABASE_DIRECT_URL: "postgresql://matchboard:matchboard@localhost:5432/matchboard_test?schema=public"
      DATABASE_URL: "postgresql://matchboard:matchboard@localhost:5432/matchboard_test?schema=public"
      AUTH_SECRET: "ci-test-secret-not-for-production"
      MATCHBOARD_ENV: "test"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: matchboard
          POSTGRES_PASSWORD: matchboard
          POSTGRES_DB: matchboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DIRECT_URL: "postgresql://matchboard:matchboard@localhost:5432/matchboard_test?schema=public"
      - run: npm run security:authz

  forbidden-sql:
    name: Forbidden SQL Methods
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run security:check-sql

  supply-chain:
    name: Supply Chain Integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run security:check-supply-chain