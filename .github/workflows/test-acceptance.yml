name: Test Acceptance

# Per-PR feature acceptance pipeline: deploys the exact PR commit against an isolated Neon
# child branch, aliases the shared test.matchboard.football slot to it for functional
# validation, then restores the slot to main + persistent Test on close. See
# docs/adr/0075-per-pr-feature-acceptance-pipeline.md for the full design and the required
# repo secrets (NEON_API_KEY, NEON_PROJECT_ID, VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_TEST_PROJECT_ID) that must be configured by someone with repo admin access before
# this can run for real — this workflow degrades to a clean skip if they're absent, the same
# pattern used by the e2e job in ci-checks.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# Only one feature candidate may occupy the shared Test slot at a time (PROGRAMME.md §8).
# cancel-in-progress: false is deliberate — a run already in flight (deploy or cleanup) must
# finish before the next one starts, so ownership transitions are always clean, never
# half-applied. GitHub Actions' own serialization is the entire locking mechanism; no separate
# lock primitive is needed.
concurrency:
  group: test-slot
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  acceptance-deploy:
    name: Deploy PR to Test slot
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GIT_BRANCH: ${{ github.head_ref }}
      GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TEST_PROJECT_ID: ${{ secrets.VERCEL_TEST_PROJECT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEST_AGENT_AUTH_SECRET: ${{ secrets.TEST_AGENT_AUTH_SECRET }}
    steps:
      # The `secrets` context is not valid in any `if:` expression (job- or step-level) —
      # GitHub rejects the whole workflow file at parse time if it appears there, which is
      # exactly what silently broke every job in ci-checks.yml until it was found and fixed
      # (see that file's e2e job comment, and ADR/PR history for the incident). Check inside a
      # shell step instead, gate the remaining steps on a `steps.*.outputs` value.
      - name: Check required secrets are configured
        id: check
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_TEST_PROJECT_ID" ] || [ -z "$TEST_AGENT_AUTH_SECRET" ]; then
            echo "Required secrets not fully configured; skipping per-PR Test acceptance."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      # A docs/ADR/tracking-only push can't affect the running app, but still cost a full Neon
      # branch deploy + Vercel deploy + Playwright run — exactly what exhausted this project's
      # Vercel deploy quota on PR #313's trailing wording-only commit (2026-08-20). Skip the
      # deploy (not the whole job, so acceptance-cleanup below is never affected by this check)
      # when every file in the PR's compare range is docs/tracking-only. See
      # docs/adr/0075-per-pr-feature-acceptance-pipeline.md's History.
      - name: Check whether this push only touched docs/tracking files
        id: docs-only
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          FILES="$(gh api "repos/${{ github.repository }}/compare/${BASE_SHA}...${HEAD_SHA}" --paginate --jq '.files[].filename')"
          if [ -z "$FILES" ]; then
            echo "No changed files reported by the compare API — deploying to be safe."
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
          elif echo "$FILES" | grep -qvE '^(docs/|\.matchboard-work/|.*\.md$)'; then
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
          else
            echo "Every changed file is docs/tracking-only — skipping the Test slot deploy."
            echo "only_docs=true" >> "$GITHUB_OUTPUT"
          fi
      # ref: github.head_ref is required here — without it, actions/checkout's default behavior
      # for a pull_request event checks out the refs/pull/<PR>/merge commit in DETACHED HEAD
      # state, not a real branch. deploy.sh's `vercel deploy` relies on Vercel's own git-metadata
      # auto-detection (reading the local .git checkout) to pick the branch-scoped DATABASE_URL/
      # DIRECT_URL Preview env vars deploy.sh sets further down — a detached HEAD can't match a
      # named-branch scope, so the build silently fell back to this Vercel project's generic
      # "Production, Preview" DATABASE_URL instead of the isolated per-PR Neon branch. Confirmed
      # live, 2026-08-24 (see ADR-0075's History and ARR-0024): every Playwright run against this
      # PR was actually mutating the shared, persistent `test` Neon branch — the exact data other
      # PRs, ci-checks.yml's post-merge smoke job, and local `npm run test:e2e` also depend on —
      # not the intended isolated `pr-<N>` branch, silently defeating the entire point of
      # ADR-0075's per-PR isolation design.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.5
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
      - name: Install neonctl and vercel CLIs
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        run: npm install -g neonctl vercel
      - name: Deploy PR commit to isolated Test slot
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        run: bash scripts/test-acceptance/deploy.sh
      - name: Install Playwright browser
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        run: npx playwright install --with-deps chromium
      - name: Functional acceptance (Playwright, against the aliased Test slot)
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        run: npm run test:e2e
      # Without this, a Playwright failure's only diagnostic evidence is the console summary
      # (call log + surrounding source lines) — no screenshot, no DOM snapshot, no trace. That
      # gap materially slowed diagnosing a 2026-08-24 flaky-fixture failure (root cause required
      # guessing from text output alone). Uploads regardless of outcome so a passing run's traces
      # remain available too; short retention since these are debugging aids, not release
      # artifacts.
      - name: Upload Playwright results (screenshots, traces, error context)
        if: always() && steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-${{ github.run_id }}
          path: test-results/
          retention-days: 5
          if-no-files-found: ignore
      # deploy.sh's own ERR trap only covers failures inside that one bash process. A failure in
      # any *later* step (this job's Playwright step, or the Node.js/Playwright install steps
      # before it) happens after deploy.sh already succeeded and already moved the alias — those
      # failures are invisible to a trap that only exists for the duration of deploy.sh's own
      # process, so the shared slot would otherwise stay pointed at this PR's deployment
      # indefinitely (observed live: PR #306's Playwright step failed and the shared
      # test.matchboard.football slot stayed stuck on its deployment until manually restored).
      # `if: failure()` covers every prior step in the job, not just this one.
      - name: On any failure, restore Test slot alias to main baseline
        if: failure() && steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        run: bash scripts/test-acceptance/restore-baseline-alias.sh

  acceptance-cleanup:
    name: Clean up PR's Test slot resources
    if: github.event.action == 'closed'
    runs-on: ubuntu-24.04
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GIT_BRANCH: ${{ github.head_ref }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TEST_PROJECT_ID: ${{ secrets.VERCEL_TEST_PROJECT_ID }}
    steps:
      - name: Check required secrets are configured
        id: check
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_TEST_PROJECT_ID" ]; then
            echo "Required secrets not fully configured; skipping Test slot cleanup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        if: steps.check.outputs.configured == 'true'
      - name: Install neonctl and vercel CLIs
        if: steps.check.outputs.configured == 'true'
        run: npm install -g neonctl vercel
      - name: Restore Test slot to main baseline, delete isolated resources
        if: steps.check.outputs.configured == 'true'
        run: bash scripts/test-acceptance/cleanup.sh
