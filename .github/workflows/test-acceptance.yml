name: Test Acceptance

# Per-PR feature acceptance pipeline: deploys the exact PR commit against an isolated Neon
# child branch, aliases the shared test.matchboard.football slot to it for functional
# validation, then restores the slot to main + persistent Test on close. See
# docs/adr/0075-per-pr-feature-acceptance-pipeline.md for the original design, and
# docs/adr/0153-converge-to-single-vercel-project-with-deliberate-acceptance.md for why this now
# runs against a single Vercel project's `test` Custom Environment, triggered by an explicit
# `acceptance` PR label rather than on every push. Required repo secrets (NEON_API_KEY,
# NEON_PROJECT_ID, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) must be configured by someone
# with repo admin access before this can run for real — this workflow degrades to a clean skip
# if they're absent, the same pattern used by the e2e job in ci-checks.yml.
#
# ADR-0153's cost-containment goal requires that an ordinary push to an open PR does NOT
# provision Neon/Vercel resources. Only two triggers do real work here: applying the
# `acceptance` label (deploy), and closing the PR (cleanup). A push to an already-labeled PR
# removes the label instead of redeploying — the prior acceptance is now for a different commit
# and is no longer valid; re-apply the label to request acceptance again for the new commit.

on:
  pull_request:
    types: [labeled, synchronize, closed]
    branches: [main]

# Only one feature candidate may occupy the shared Test slot at a time (PROGRAMME.md §8).
# cancel-in-progress: false is deliberate — a run already in flight (deploy or cleanup) must
# finish before the next one starts, so ownership transitions are always clean, never
# half-applied. GitHub Actions' own serialization is the entire locking mechanism; no separate
# lock primitive is needed. test-db-migrate.yml's deploy-test-baseline job shares this same
# group, so a post-merge baseline redeploy can never race an in-flight acceptance run either.
concurrency:
  group: test-slot
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  acceptance-invalidate:
    name: Invalidate stale acceptance on new commits
    if: github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'acceptance')
    runs-on: ubuntu-24.04
    steps:
      - name: Remove acceptance label and explain why
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --remove-label acceptance
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body \
            "New commits were pushed, which invalidates the prior \`acceptance\` approval for this PR. Re-apply the \`acceptance\` label once the branch is ready to request acceptance again."

  acceptance-deploy:
    name: Deploy PR to Test slot
    if: github.event.action == 'labeled' && github.event.label.name == 'acceptance'
    runs-on: ubuntu-24.04
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEST_AGENT_AUTH_SECRET: ${{ secrets.TEST_AGENT_AUTH_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIVE_MATCH_INTERNAL_SECRET_TEST: ${{ secrets.LIVE_MATCH_INTERNAL_SECRET_TEST }}
    steps:
      # The `secrets` context is not valid in any `if:` expression (job- or step-level) —
      # GitHub rejects the whole workflow file at parse time if it appears there, which is
      # exactly what silently broke every job in ci-checks.yml until it was found and fixed
      # (see that file's e2e job comment, and ADR/PR history for the incident). Check inside a
      # shell step instead, gate the remaining steps on a `steps.*.outputs` value.
      - name: Check required secrets are configured
        id: check
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$TEST_AGENT_AUTH_SECRET" ]; then
            echo "Required secrets not fully configured; skipping per-PR Test acceptance."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      # Separate, optional gate (ADR-0112): a PR that doesn't touch workers/live-match/ still
      # gets full Vercel/Neon acceptance even when Cloudflare secrets are absent — only the
      # Worker deploy step below is skipped, never the whole job.
      - name: Check Cloudflare secrets are configured
        id: check-cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not fully configured; skipping per-PR Worker deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      # A docs/ADR/tracking/agent-tooling-only PR can't affect the running app, but acceptance
      # would still cost a full Neon branch deploy + Vercel deploy + Playwright run for nothing.
      # Since this job now only ever runs once per explicit `acceptance` labeling (ADR-0153),
      # not on every push, the right question is simply "is this PR's entire diff docs-only" —
      # always base...head, the PR's full cumulative diff versus main. (ADR-0075's History has a
      # per-push version of this same check that deliberately avoided base...head — that bug was
      # about silently never skipping a later docs-only push once the PR had any real commit;
      # it doesn't apply here, since there is no "later push" for this job to react to.)
      #
      # The path classification itself lives in one place, scripts/is-build-skip-eligible.sh —
      # shared with vercel-ignore-build-step.sh (the automatic main-only Preview-build skip)
      # rather than a second independently-maintained copy.
      #
      # `gh api` runs under this shell's default `bash -e`: a failed command (non-zero exit)
      # aborts the step immediately unless it's the condition of an `if`. Wrapping the call in
      # `if ! FILES=...` catches any `gh api` failure (rate limit, transient network error,
      # unparseable response) the same conservative way instead of aborting outright.
      # Lightweight, unconditional, ref-agnostic checkout — this job's real deploy checkout
      # further down (with the `ref: github.head_ref` fix ARR-0024 required) stays conditional
      # on NOT skipping, so a genuinely skip-eligible push still avoids that heavier step. This
      # one exists solely so the next step can read scripts/is-build-skip-eligible.sh.
      - name: Checkout (shared skip-path script only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check whether this PR's entire diff only touches docs/tracking files
        id: docs-only
        run: |
          COMPARE_RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          if ! FILES="$(gh api "repos/${{ github.repository }}/compare/${COMPARE_RANGE}" --paginate --jq '.files[]?.filename' 2>&1)"; then
            echo "Could not read the compare API for ${COMPARE_RANGE} — deploying to be safe. Response: $FILES"
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$FILES" ]; then
            echo "No changed files reported by the compare API — deploying to be safe."
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
          else
            VERDICT="$(echo "$FILES" | bash scripts/is-build-skip-eligible.sh app-deploy)"
            if [ "$VERDICT" = "skip" ]; then
              echo "Every changed file in this PR (${COMPARE_RANGE}) is build-skip-eligible — skipping the Test slot deploy."
              echo "only_docs=true" >> "$GITHUB_OUTPUT"
            else
              echo "only_docs=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      # ref: github.head_ref is required here — without it, actions/checkout's default behavior
      # for a pull_request event checks out the refs/pull/<PR>/merge commit in DETACHED HEAD
      # state, not a real branch. vercel deploy's own git-metadata auto-detection (reading the
      # local .git checkout) needs the real branch name recorded on the resulting deployment —
      # see ARR-0024 and ADR-0075's History for the incident this fixed originally.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
      - name: Install neonctl and vercel CLIs
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        run: npm install -g neonctl vercel
      - name: Deploy PR commit to isolated Test slot
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        run: bash scripts/test-acceptance/deploy.sh
      # ADR-0112: the Worker serving realtime-test.matchboard.football otherwise always runs
      # whatever `main` last deployed (deploy-live-match-worker.yml only fires on CI-green
      # pushes to main), so a PR that changes the Worker protocol/event shapes/broadcast
      # behavior tests its client code against stale Worker code. Deploy this PR's own
      # workers/live-match/ code to the shared --env test Worker first, mirroring how the
      # Vercel preview deploy above already puts the PR's own app code live in the test slot.
      # Gracefully skipped (not job-failing) when Cloudflare secrets aren't configured — a PR
      # that doesn't touch Worker code still gets full Vercel/Neon acceptance either way.
      - name: Deploy PR's Worker code to Test environment
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true' && steps.check-cf.outputs.configured == 'true'
        run: npx wrangler deploy --config workers/live-match/wrangler.jsonc --env test
      - name: Sync test Worker internal secret
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true' && steps.check-cf.outputs.configured == 'true' && env.LIVE_MATCH_INTERNAL_SECRET_TEST != ''
        run: printf '%s' "$LIVE_MATCH_INTERNAL_SECRET_TEST" | npx wrangler secret put LIVE_MATCH_INTERNAL_SECRET --config workers/live-match/wrangler.jsonc --env test
      - name: Install Playwright browser
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Functional acceptance (Playwright, against the aliased Test slot)
        if: steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        run: npm run test:e2e
      # Without this, a Playwright failure's only diagnostic evidence is the console summary
      # (call log + surrounding source lines) — no screenshot, no DOM snapshot, no trace. This
      # gap materially slowed diagnosing a 2026-08-24 flaky-fixture failure (root cause required
      # guessing from text output alone). Uploads regardless of outcome so a passing run's traces
      # remain available too; short retention since these are debugging aids, not release
      # artifacts.
      - name: Upload Playwright results (screenshots, traces, error context)
        if: always() && steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ github.run_id }}
          path: test-results/
          retention-days: 5
          if-no-files-found: ignore
      # deploy.sh's own ERR trap only covers failures inside that one bash process. A failure in
      # any *later* step (this job's Playwright step, or the Node.js/Playwright install steps
      # before it) happens after deploy.sh already succeeded and already moved the alias — those
      # failures are invisible to a trap that only exists for the duration of deploy.sh's own
      # process, so the shared slot would otherwise stay pointed at this PR's deployment
      # indefinitely (observed live: PR #306's Playwright step failed and the shared
      # test.matchboard.football slot stayed stuck on its deployment until manually restored).
      # `if: failure()` covers every prior step in the job, not just this one.
      - name: On any failure, restore Test slot to main baseline
        if: failure() && steps.check.outputs.configured == 'true' && steps.docs-only.outputs.only_docs != 'true'
        run: bash scripts/test-acceptance/restore-baseline-alias.sh

  acceptance-cleanup:
    name: Clean up PR's Test slot resources
    if: github.event.action == 'closed'
    runs-on: ubuntu-24.04
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check required secrets are configured
        id: check
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Required secrets not fully configured; skipping Test slot cleanup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.configured == 'true'
      - name: Install neonctl and vercel CLIs
        if: steps.check.outputs.configured == 'true'
        run: npm install -g neonctl vercel
      - name: Restore Test slot to main baseline, delete isolated resources
        if: steps.check.outputs.configured == 'true'
        run: bash scripts/test-acceptance/cleanup.sh
