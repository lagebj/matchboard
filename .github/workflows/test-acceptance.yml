name: Test Acceptance

# Per-PR feature acceptance pipeline: deploys the exact PR commit against an isolated Neon
# child branch, aliases the shared test.matchboard.football slot to it for functional
# validation, then restores the slot to main + persistent Test on close. See
# docs/adr/0075-per-pr-feature-acceptance-pipeline.md for the full design and the required
# repo secrets (NEON_API_KEY, NEON_PROJECT_ID, VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_TEST_PROJECT_ID) that must be configured by someone with repo admin access before
# this can run for real — this workflow degrades to a clean skip if they're absent, the same
# pattern used by the e2e job in ci-checks.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# Only one feature candidate may occupy the shared Test slot at a time (PROGRAMME.md §8).
# cancel-in-progress: false is deliberate — a run already in flight (deploy or cleanup) must
# finish before the next one starts, so ownership transitions are always clean, never
# half-applied. GitHub Actions' own serialization is the entire locking mechanism; no separate
# lock primitive is needed.
concurrency:
  group: test-slot
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  acceptance-deploy:
    name: Deploy PR to Test slot
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GIT_BRANCH: ${{ github.head_ref }}
      GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TEST_PROJECT_ID: ${{ secrets.VERCEL_TEST_PROJECT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEST_AGENT_AUTH_SECRET: ${{ secrets.TEST_AGENT_AUTH_SECRET }}
    steps:
      # The `secrets` context is not valid in any `if:` expression (job- or step-level) —
      # GitHub rejects the whole workflow file at parse time if it appears there, which is
      # exactly what silently broke every job in ci-checks.yml until it was found and fixed
      # (see that file's e2e job comment, and ADR/PR history for the incident). Check inside a
      # shell step instead, gate the remaining steps on a `steps.*.outputs` value.
      - name: Check required secrets are configured
        id: check
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_TEST_PROJECT_ID" ] || [ -z "$TEST_AGENT_AUTH_SECRET" ]; then
            echo "Required secrets not fully configured; skipping per-PR Test acceptance."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        if: steps.check.outputs.configured == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.5
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        if: steps.check.outputs.configured == 'true'
      - name: Install neonctl and vercel CLIs
        if: steps.check.outputs.configured == 'true'
        run: npm install -g neonctl vercel
      - name: Deploy PR commit to isolated Test slot
        if: steps.check.outputs.configured == 'true'
        run: bash scripts/test-acceptance/deploy.sh
      - name: Install Playwright browser
        if: steps.check.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium
      - name: Functional acceptance (Playwright, against the aliased Test slot)
        if: steps.check.outputs.configured == 'true'
        run: npm run test:e2e

  acceptance-cleanup:
    name: Clean up PR's Test slot resources
    if: github.event.action == 'closed'
    runs-on: ubuntu-24.04
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GIT_BRANCH: ${{ github.head_ref }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TEST_PROJECT_ID: ${{ secrets.VERCEL_TEST_PROJECT_ID }}
    steps:
      - name: Check required secrets are configured
        id: check
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_TEST_PROJECT_ID" ]; then
            echo "Required secrets not fully configured; skipping Test slot cleanup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        if: steps.check.outputs.configured == 'true'
      - name: Install neonctl and vercel CLIs
        if: steps.check.outputs.configured == 'true'
        run: npm install -g neonctl vercel
      - name: Restore Test slot to main baseline, delete isolated resources
        if: steps.check.outputs.configured == 'true'
        run: bash scripts/test-acceptance/cleanup.sh
