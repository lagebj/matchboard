name: Visual Authority Gate

# ADR-0159: reports the "Visual Authority Gate" check for every PR to main — NOT_APPLICABLE when
# nothing UI-Lab/visual-authority-relevant changed, APPROVED/AWAITING_APPROVAL/INVALID otherwise,
# re-derived fresh from the PR's own comment thread on every run (no separate approval-state
# storage to go stale). Triggers on PR lifecycle events AND on every PR comment event, so an
# approval/rejection/edit/deletion re-evaluates the gate immediately — never path-filtered (the
# PR #675 lesson recorded in docs/adr/0075-...md's History: a path-filtered workflow with
# required-named jobs can leave them permanently "expected" the moment a ruleset requires them).
#
# This workflow never checks out PR code — every file read (for fingerprinting) goes through the
# GitHub Contents API instead, specifically to avoid ARR-0024's class of bug (actions/checkout
# defaulting to a detached merge ref with no explicit `ref:`). It also never deploys anything;
# see visual-review-deploy.yml for the separate, explicitly-requested lightweight deploy path.
#
# Stage A only (see docs/adr/0159-...md): this check is NOT yet added to ruleset 21317362's
# required checks, so it cannot block any merge. That is a separate, later, explicitly-authorized
# action (Stage B).

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  resolve-pr:
    name: Resolve PR context
    runs-on: ubuntu-24.04
    outputs:
      is_pr: ${{ steps.resolve.outputs.is_pr }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Resolve PR number and head SHA for either trigger
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_FROM_PULL_REQUEST: ${{ github.event.pull_request.number }}
          HEAD_SHA_FROM_PULL_REQUEST: ${{ github.event.pull_request.head.sha }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER_FROM_PULL_REQUEST" >> "$GITHUB_OUTPUT"
            echo "head_sha=$HEAD_SHA_FROM_PULL_REQUEST" >> "$GITHUB_OUTPUT"
          elif [ -n "$ISSUE_PR_URL" ]; then
            # issue_comment fires for both issues and PR comments; github.event.pull_request does
            # not exist on this event at all — only github.event.issue.pull_request's presence
            # tells us this comment is on a PR, and we must look up the PR's own head SHA fresh
            # via the API.
            PR_JSON="$(gh api "repos/${{ github.repository }}/pulls/$ISSUE_NUMBER")"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(echo "$PR_JSON" | jq -r '.head.sha')" >> "$GITHUB_OUTPUT"
          else
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
          fi

  gate:
    name: Evaluate Visual Authority Gate
    needs: resolve-pr
    if: always() && needs.resolve-pr.outputs.is_pr == 'true'
    runs-on: ubuntu-24.04
    steps:
      # SECURITY: this checkout uses a LITERAL `main`, never an expression derived from PR/event
      # data (CodeQL's actions/untrusted-checkout query flagged the previous `base_ref`-expression
      # form — a literal string has no taint flow from untrusted input for it to flag, and this
      # repo's ruleset only ever governs `main` regardless of what branch any given PR targets).
      # This job exercises checks:write against the exact PR head SHA using the decision logic in
      # scripts/visual-authority/ — that logic must always be the repository's own trusted
      # version, never a PR-controlled version. Checking out the PR's own ref here would let any
      # PR simply rewrite evaluate-gate.mjs to self-report APPROVED. All actual PR data (changed
      # files, comments, file contents at the PR's head SHA) is read exclusively via the GitHub
      # API from within run-gate.mjs, never from this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/visual-authority
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Evaluate and report the gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
        run: node scripts/visual-authority/run-gate.mjs
