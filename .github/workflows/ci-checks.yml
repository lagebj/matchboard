name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint

  # workers/live-match/ (the Cloudflare Worker + MatchSessionObject Durable Object, ADR-0086) is
  # an independently deployed runtime with its own tsconfig/vitest config (incompatible
  # @cloudflare/workers-types vs the main app's `dom` lib — see workers/live-match/vitest.config.ts),
  # so it is deliberately excluded from the `typecheck`/`test` jobs above rather than folded in.
  # These two jobs give it the same mandatory, independently-attributable CI gate instead
  # (ARR-0025, AIP-1). deploy-live-match-worker.yml triggers on this workflow's overall
  # `conclusion == 'success'`, so a failure here already blocks the deploy — no change needed
  # there.
  typecheck-workers:
    name: TypeScript Check (Workers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck:workers

  test-workers:
    name: Tests (Workers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:workers

  security-check-sql:
    name: Forbidden SQL Methods
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run security:check-sql

  security-check-supply-chain:
    name: Supply Chain Integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run security:check-supply-chain

  version-verify:
    name: Version Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run version:verify

  test:
    name: Tests
    runs-on: ubuntu-24.04
    # CI test environment only — production uses Vercel/Neon secrets
    env:
      TEST_DATABASE_URL: "postgresql://matchboard:matchboard@localhost:5432/matchboard_test?schema=public"
      TEST_DATABASE_DIRECT_URL: "postgresql://matchboard:matchboard@localhost:5432/matchboard_test?schema=public"
      DATABASE_URL: "postgresql://matchboard:matchboard@localhost:5432/matchboard_test?schema=public"
      AUTH_SECRET: "ci-test-secret-not-for-production"
      MATCHBOARD_ENV: "test"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: matchboard
          POSTGRES_PASSWORD: matchboard
          POSTGRES_DB: matchboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DIRECT_URL: "postgresql://matchboard:matchboard@localhost:5432/matchboard_test?schema=public"
      - run: npm test

  e2e:
    name: Browser Acceptance Tests
    runs-on: ubuntu-24.04
    # push-only (not pull_request): test-acceptance.yml now owns pre-merge PR-level Playwright
    # validation, running against a per-PR isolated deployment it aliases test.matchboard.football
    # to (docs/adr/0075-per-pr-feature-acceptance-pipeline.md). Running this job on pull_request
    # too would race it — both would hit the one shared test.matchboard.football slot at
    # unpredictable times, so this could easily test whatever PR most recently grabbed the alias
    # instead of the commit CI thinks it's checking. This job now serves PROGRAMME.md §10's
    # post-merge "perform smoke validation" step instead, against the just-restored baseline.
    if: github.event_name == 'push'
    # A transient runner/network hang (observed on `playwright install --with-deps`, which
    # normally takes ~2 minutes) can otherwise consume the default 360-minute job timeout. 15
    # minutes comfortably covers npm ci + browser install + the full smoke suite (~4 minutes
    # observed) with headroom, while failing fast on a genuine hang instead of blocking the PR.
    timeout-minutes: 15
    # Requires the TEST_AGENT_AUTH_SECRET repo secret to match the deployed Test environment's
    # secret (docs/development/browser-acceptance-testing.md). Skips cleanly if not yet
    # configured rather than failing every run. The `secrets` context is not a valid named-value
    # in *any* `if:` expression (job-level or step-level) — GitHub rejects the entire workflow
    # file at parse time if it appears there, which silently prevented every job in this file
    # from ever dispatching. The check runs inside a shell step instead, using a `steps.*.outputs`
    # value (not `secrets` directly) to gate the remaining steps.
    env:
      TEST_AGENT_AUTH_SECRET: ${{ secrets.TEST_AGENT_AUTH_SECRET }}
    steps:
      - name: Check TEST_AGENT_AUTH_SECRET is configured
        id: check
        run: |
          if [ -z "$TEST_AGENT_AUTH_SECRET" ]; then
            echo "TEST_AGENT_AUTH_SECRET not configured; skipping browser acceptance tests."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        if: steps.check.outputs.configured == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        if: steps.check.outputs.configured == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.check.outputs.configured == 'true'
      - run: npm run test:e2e
        if: steps.check.outputs.configured == 'true'
      - name: Upload Playwright results (screenshots, traces, error context)
        if: always() && steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ github.run_id }}
          path: test-results/
          retention-days: 5
          if-no-files-found: ignore

  migration-from-zero:
    name: Migration from Zero
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: matchboard
          POSTGRES_PASSWORD: matchboard
          POSTGRES_DB: matchboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Apply all migrations from empty database
        run: |
          MIGRATE_DB="migrate_verify_$(date +%s)"
          PGPASSWORD=matchboard psql -h localhost -p 5432 -U matchboard -d postgres -c "CREATE DATABASE \"$MIGRATE_DB\";"
          DIRECT_URL="postgresql://matchboard:matchboard@localhost:5432/$MIGRATE_DB?schema=public" npx prisma migrate deploy
          PGPASSWORD=matchboard psql -h localhost -p 5432 -U matchboard -d postgres -c "DROP DATABASE IF EXISTS \"$MIGRATE_DB\";"

  # ARR-0026/AIP-5: migration-from-zero above only proves the migration chain is internally
  # consistent against an EMPTY schema. This proves pending migrations are also safe against a
  # POPULATED database — the actual situation production-db-migrate.yml applies them to — by
  # forking a disposable Neon branch from the persistent "test" branch (already populated with
  # real, ongoing test/CI data) and applying whatever migrations are pending relative to it. Skips
  # cleanly if the Neon secrets aren't configured, same pattern as the e2e job's TEST_AGENT_AUTH_SECRET
  # gate — the `secrets` context cannot appear in any `if:` expression (see e2e job's own comment).
  migration-upgrade-from-populated-state:
    name: Migration Upgrade (Populated State)
    # push-only (not pull_request), same reasoning as the e2e job above: this forks a real Neon
    # branch, which costs Neon compute-hour quota shared with test-acceptance.yml's per-PR
    # branches. Confirmed live (2026-08-24): running on every PR push exhausted the project's
    # Neon compute quota within one session's worth of pushes ("compute time quota exceeded;
    # usage 398508, limit 396000"). Running only on push-to-main still satisfies ARR-0026's "before
    # production deployment" acceptance criterion (production-db-migrate.yml also triggers off
    # push-to-main CI success), just not "before merge" — an accepted trade-off given the shared
    # resource constraint. See ADR-0090's History.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - name: Check required secrets are configured
        id: check
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "NEON_API_KEY/NEON_PROJECT_ID not configured; skipping migration upgrade-path verification."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        if: steps.check.outputs.configured == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        if: steps.check.outputs.configured == 'true'
      - run: npm install -g neonctl
        if: steps.check.outputs.configured == 'true'
      - run: bash scripts/verify-migration-upgrade.sh
        if: steps.check.outputs.configured == 'true'

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [typecheck, test, security-check-supply-chain]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build