services:
  postgres:
    image: postgres:17-alpine
    container_name: matchboard-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: matchboard
      POSTGRES_PASSWORD: matchboard
      POSTGRES_DB: matchboard
    volumes:
      - matchboard-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql

volumes:
  matchboard-pgdata: