type: command/shell
typeVersion: 2026.02.09.1
id: 7b83bfad-9531-4413-ad49-ddfe5b564791
name: deploy-test-candidate
version: 1
tags:
  swamp-procedure: deploy-test-candidate
globalArguments: {}
methods:
  execute:
    arguments:
      run: |
        set -e
        cat <<'EOF'
        Per-PR candidate deploys are automated by .github/workflows/test-acceptance.yml
        (ADR-0075): it fires on pull_request events, deploys the exact PR commit against
        an isolated Neon child branch, and aliases test.matchboard.football to it for
        acceptance. There is no separate agent-triggered deploy step to run here — open
        or push to a PR and the workflow handles it. After merge, Test deploys from main
        automatically (Vercel Git integration) and the slot is restored to that baseline.
        Run the verify-test-candidate model to confirm current slot state.

        Current Test slot state:
        EOF
        curl -fsS --max-time 10 https://test.matchboard.football/api/meta || {
          echo "[FAIL] Could not reach https://test.matchboard.football/api/meta" >&2
          exit 1
        }
