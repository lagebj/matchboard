type: command/shell
typeVersion: 2026.02.09.1
id: 6e8c9c7d-21b0-417d-82ae-56ea7bd1b993
name: release-test-candidate
version: 1
tags:
  swamp-procedure: release-test-candidate
globalArguments: {}
methods:
  execute:
    arguments:
      run: |
        set -e
        cat <<'EOF'
        Release (post-merge slot restoration) is automated by
        .github/workflows/test-acceptance.yml (ADR-0075): on PR close, it aliases
        test.matchboard.football back to main's baseline deployment, removes the PR's
        branch-scoped Vercel env vars, and deletes its isolated Neon branch. There is no
        separate agent-triggered release step to run here — merging (or closing) the PR
        handles it. Run the verify-test-candidate model to confirm current slot state.

        Current Test slot state:
        EOF
        curl -fsS --max-time 10 https://test.matchboard.football/api/meta || {
          echo "[FAIL] Could not reach https://test.matchboard.football/api/meta" >&2
          exit 1
        }
