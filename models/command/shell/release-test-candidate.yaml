type: command/shell
typeVersion: 2026.02.09.1
id: 6e8c9c7d-21b0-417d-82ae-56ea7bd1b993
name: release-test-candidate
version: 1
tags:
  swamp-procedure: release-test-candidate
globalArguments: {}
methods:
  # ADR-0153: pass env.VERCEL_AUTOMATION_BYPASS_SECRET or the status check below gets a 302
  # login page instead of JSON (the test Custom Environment is behind Vercel's SSO protection).
  execute:
    arguments:
      env:
        VERCEL_AUTOMATION_BYPASS_SECRET: ""
      run: |
        set -e
        cat <<'EOF'
        Release (post-merge slot restoration) is automated by
        .github/workflows/test-acceptance.yml (ADR-0075, retargeted by ADR-0153): on PR
        close, it aliases test.matchboard.football back to main's baseline deployment,
        restores DATABASE_URL/DIRECT_URL on the test Custom Environment to the
        persistent Neon branch, and deletes the PR's isolated Neon branch. There is no
        separate agent-triggered release step to run here — merging (or closing) the PR
        handles it. Run the verify-test-candidate model to confirm current slot state.

        Current Test slot state:
        EOF
        curl -fsS --max-time 10 -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" https://test.matchboard.football/api/meta || {
          echo "[FAIL] Could not reach https://test.matchboard.football/api/meta" >&2
          exit 1
        }
